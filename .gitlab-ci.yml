# 使用 Python 3.9+ 鏡像，適合 Streamlit 同 RAG 庫
image: python:3.9-slim

stages:
  - lint       # 檢查代碼格式
  - test       # 執行邏輯測試
  - security   # 檢查有冇洩漏 Secret

# 緩存 Python 庫，加快速度
cache:
  paths:
    - .cache/pip
    - venv/

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# 1. 檢查代碼風格 (Linting)
linting_job:
  stage: lint
  script:
    - pip install flake8
    - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

# 2. 核心邏輯測試 (Testing)
# 呢度可以確保你嘅 PDF loader 同 ChromaDB 連接係正常嘅
rag_logic_test:
  stage: test
  script:
    - pip install -r requirements.txt
    - pip install pytest
    - # 關鍵：喺 CI 設定一個假的 API Key，防止 Library 因為搵唔到 Key 而 Crash
    - export OPENAI_API_KEY="sk-test-12345"
    - pytest tests/test_rag_logic.py

# 3. 密鑰洩漏檢查
secret_scan:
  stage: security
  script:
    - pip install detect-secrets
    - detect-secrets scan > secrets_report.json
  artifacts:
    paths:
      - secrets_report.json